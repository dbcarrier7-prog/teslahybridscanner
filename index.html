<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tesla Hybrid Scanner V2</title>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 10px; text-align: center; background-color: #f0f2f5; margin: 0; overflow-x: hidden; }
    h2, h3 { margin: 10px 0; color: #333; }
    .hidden { display: none !important; }
    
    #screen-loading, #screen-home, #screen-auth-yard, #screen-auth-gm, #screen-auth-port, #screen-scanner, #screen-my-list {
      max-width: 500px; margin: 0 auto; padding: 20px; background: white; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); box-sizing: border-box; margin-top: 20px;
    }
    
    button { width: 100%; padding: 16px; font-size: 18px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; margin-top: 10px; transition: 0.2s; }
    .btn-yard { background-color: #28a745; color: white; }
    .btn-gm { background-color: #007bff; color: white; }
    .btn-port { background-color: #fd7e14; color: white; } 
    .btn-save { background-color: #ff9800; color: white; }
    .btn-cancel { background-color: #6c757d; color: white; }
    .btn-home { background-color: #f8f9fa; color: #333; border: 1px solid #ddd; margin-top: 20px; }
    .btn-list { background-color: #17a2b8; color: white; margin-top: 15px; } 
    
    input, select { width: 100%; padding: 15px; margin: 10px 0; font-size: 18px; border: 2px solid #ddd; border-radius: 8px; text-align: center; box-sizing: border-box; }
    
    #control-panel { background: rgba(255, 255, 255, 0.95); padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); box-sizing: border-box; margin-top: 20px; }
    #vin-display { font-size: 1.4em; color: #000; letter-spacing: 1px; font-weight: bold; }
    
    .msg-error { color: #dc3545; font-size: 1.2em; font-weight: bold; margin: 10px 0; }
    .msg-warn { color: #ffc107; font-size: 1.2em; font-weight: bold; margin: 10px 0; }
    .msg-success { color: #28a745; font-size: 1.2em; font-weight: bold; margin: 10px 0; }
    .msg-blue { color: #0056b3; font-size: 1.2em; font-weight: bold; margin: 10px 0; background-color: #e3f2fd; padding: 10px; border-radius: 8px; }
    
    #status-bar { margin-top: 10px; font-weight: bold; color: #555; font-size: 1.1em; }
    .company-logo { width: 150px; height: auto; margin-bottom: 10px; } 
    .tesla-red { color: #cc0000; font-weight: bold; } 
    
    #my-list-ul { list-style: none; padding: 0; text-align: left; background: #fafafa; border-radius: 8px; border: 1px solid #ddd; max-height: 350px; overflow-y: auto; margin-top: 15px; }
    #my-list-ul li { padding: 12px; border-bottom: 1px solid #eee; font-size: 16px; color: #333; display: flex; justify-content: space-between; align-items: center; }
    #my-list-ul li:last-child { border-bottom: none; }
    #my-list-ul li strong { font-size: 18px; color: #0056b3; display: block; margin-top: 3px;}
    .btn-delete { width: auto; padding: 8px 15px; margin: 0; background-color: #dc3545; color: white; font-size: 14px; border-radius: 5px; }
  </style>
</head>
<body>

  <div id="screen-loading">
    <h3>🔄 시스템 연결 중...</h3><p>최신 데이터를 불러오고 있습니다.</p>
  </div>

  <div id="screen-home" class="hidden">
    <img src="https://i.postimg.cc/7LSzLXw1/2024-dongbu-logo.png" alt="회사 로고" class="company-logo">
    <h2><span class="tesla-red">TESLA</span> QR 스캐너</h2><p>작업하실 모드를 선택해주세요.</p>
    <button class="btn-yard" onclick="showScreen('screen-auth-yard')">🟢 야드 위치 등록 (직원용)</button>
    <button class="btn-gm" onclick="showScreen('screen-auth-gm')">🔵 광명 상차 진행 (기사용)</button>
    <button class="btn-port" onclick="showScreen('screen-auth-port')">🟠 항/창고 작업 (기사용)</button>
  </div>

  <div id="screen-auth-yard" class="hidden">
    <h3>🟢 직원 인증</h3><p>부여받은 PIN 번호(4자리)를 입력하세요.</p>
    <input type="password" id="pin-input" placeholder="PIN 번호 입력" inputmode="numeric" />
    <button class="btn-yard" onclick="verifyPin()">확인 및 시작</button>
    <button class="btn-home" onclick="showScreen('screen-home')">🔙 처음으로</button>
  </div>

  <div id="screen-auth-gm" class="hidden">
    <h3>🔵 기사 정보 입력</h3><p>상차 기록을 위해 성함(또는 호차)을 입력하세요.</p>
    <input type="text" id="driver-input" placeholder="예: 홍길동 (또는 1호차)" />
    <button class="btn-gm" onclick="startGmMode()">확인 및 시작</button>
    <button class="btn-home" onclick="showScreen('screen-home')">🔙 처음으로</button>
  </div>

  <div id="screen-auth-port" class="hidden">
    <h3>🟠 항/창고 작업 설정</h3><p>작업 정보를 확인하고 선택해주세요.</p>
    <input type="text" id="port-driver-input" placeholder="기사명 입력 (예: 홍길동)" />
    
    <div style="display: flex; justify-content: space-around; align-items: center; background: #fafafa; padding: 15px; border-radius: 8px; border: 1px solid #ddd; margin: 10px 0;">
      <label style="font-size: 16px; font-weight: bold; display: flex; align-items: center; gap: 8px; cursor: pointer;">
        <input type="radio" name="portWorkType" value="port" checked onchange="updatePortDropdowns()" style="width: 20px; height: 20px; margin: 0;"> 항작업 스캔
      </label>
      <label style="font-size: 16px; font-weight: bold; display: flex; align-items: center; gap: 8px; cursor: pointer;">
        <input type="radio" name="portWorkType" value="warehouse" onchange="updatePortDropdowns()" style="width: 20px; height: 20px; margin: 0;"> 창고작업 스캔
      </label>
    </div>

    <select id="port-departure"></select>
    <select id="port-destination"></select>

    <button class="btn-port" onclick="startPortMode()">설정 완료 및 스캔 대기</button>
    <button class="btn-home" onclick="showScreen('screen-home')">🔙 처음으로</button>
  </div>

  <div id="screen-scanner" class="hidden">
    <h3 id="mode-title">스캐너 대기 중</h3>
    <div id="status-bar"></div>
    
    <div style="margin: 20px 0; font-size:15px; background: #e8f4fd; padding: 15px; border-radius: 8px; border: 1px solid #bce8f1;">
      <p style="margin:0;">💡 <b>현장 사용법:</b><br>폰 자체 <b>[QR 코드 스캔]</b>으로 라벨을 찍은 후<br>뜨는 링크를 누르면 <b>설정된 정보로 즉시 자동 저장</b>됩니다!</p>
    </div>

    <div id="control-panel" class="hidden">
      <p style="margin-top:0;">추출된 차대번호:<br><strong id="vin-display"></strong></p>
      <div id="result-message"></div>
      
      <div id="action-group" class="hidden">
        <input type="text" id="location-input" class="hidden" placeholder="위치 입력 (예: A-1)" autocomplete="off" />
        <button id="main-action-btn" class="btn-save" onclick="processAction()">위치 저장 하기</button>
      </div>
      
      <button class="btn-cancel" onclick="resetScanPanel()">다음 차량 대기 중</button>
    </div>
    
    <button id="btn-show-list" class="btn-list hidden" onclick="showMyList()">📋 내가 상차한 차량 보기</button>
    <button class="btn-home" onclick="clearStateAndHome()" style="margin-top: 30px;">🔙 로그아웃 (처음으로)</button>
  </div>

  <div id="screen-my-list" class="hidden">
    <h3>📋 내 상차 목록 (<span id="my-list-count">0</span>대)</h3>
    <ul id="my-list-ul"></ul>
    <button class="btn-gm" onclick="hideMyList()">🔙 스캐너 대기 화면으로</button>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzP9rkRFf30-UBwDZkYzLrcelBiZdX_x_9G3I0ae1PqgBo3FYxSiE8_yNQSqZPB8pNYgA/exec";
    
    let appData = null; let currentMode = ""; let currentUser = ""; let currentVin = ""; let isProcessing = false;
    let myScannedVins = []; 
    
    const PORT_LOCATIONS = {
      port: { dep: ["PIRT", "HPIT"], dest: ["PH선광", "배후부지", "AMF(서울우유)", "PCTC(한진)"] },
      warehouse: { dep: ["배후부지", "AMF(서울우유)", "PCTC(한진)"], dest: ["PH선광", "배후부지", "AMF(서울우유)", "PCTC(한진)"] }
    };

    window.onload = function() {
      updatePortDropdowns(); 
      
      const urlParams = new URLSearchParams(window.location.search);
      const scannedText = urlParams.get('scanned');
      const savedUser = localStorage.getItem('kain_currentUser');
      
      fetch(API_URL + "?action=getData").then(res => res.json()).then(data => { 
        appData = data;
        
        if (savedUser) {
           restoreState();
           updateStatusBarAfterFetch();
           showScreen("screen-scanner");
           
           if (scannedText) {
             window.history.replaceState({}, document.title, window.location.pathname);
             onScanSuccess(scannedText); // 스캔 데이터 자동 처리
           }
        } else {
           showScreen("screen-home"); 
        }
      }).catch(err => { 
        document.getElementById("screen-loading").innerHTML = "<h3 class='msg-error'>❌ 데이터 연결 실패</h3>"; 
      });
    };

    function showScreen(screenId) { document.querySelectorAll("body > div").forEach(div => div.classList.add("hidden")); document.getElementById(screenId).classList.remove("hidden"); }

    function saveState() {
      localStorage.setItem('kain_currentUser', currentUser);
      localStorage.setItem('kain_currentMode', currentMode);
      if (currentMode === 'PORT') {
        localStorage.setItem('kain_portWorkType', document.querySelector('input[name="portWorkType"]:checked').value);
        localStorage.setItem('kain_portDep', document.getElementById("port-departure").value);
        localStorage.setItem('kain_portDest', document.getElementById("port-destination").value);
      }
      localStorage.setItem('kain_myScannedVins', JSON.stringify(myScannedVins));
    }

    function restoreState() {
      currentUser = localStorage.getItem('kain_currentUser') || "";
      currentMode = localStorage.getItem('kain_currentMode') || "";
      const savedVins = localStorage.getItem('kain_myScannedVins');
      myScannedVins = savedVins ? JSON.parse(savedVins) : [];
      
      if (currentMode === 'YARD') {
        document.getElementById("mode-title").innerText = "🟢 야드 위치 등록 모드";
      } else if (currentMode === 'GM') {
        document.getElementById("mode-title").innerText = "🔵 광명 상차 진행 모드";
      } else if (currentMode === 'PORT') {
        const type = localStorage.getItem('kain_portWorkType') || 'port';
        const typeName = type === 'port' ? '항작업' : '창고작업';
        document.getElementById("mode-title").innerText = `🟠 ${typeName} 스캔 모드`;
      }
    }

    function updateStatusBarAfterFetch() {
      if (currentMode === 'YARD') {
        document.getElementById("status-bar").innerText = `작업자: ${currentUser}`;
        document.getElementById("btn-show-list").classList.add("hidden");
      } else if (currentMode === 'GM') {
        document.getElementById("status-bar").innerText = `기사명: ${currentUser} | 광명 할당량: ${appData.gmLoadedCount}대 완료`;
        document.getElementById("btn-show-list").classList.remove("hidden");
      } else if (currentMode === 'PORT') {
        const type = localStorage.getItem('kain_portWorkType') || 'port';
        const dep = localStorage.getItem('kain_portDep') || '';
        const dest = localStorage.getItem('kain_portDest') || '';
        document.getElementById("status-bar").innerText = `기사명: ${currentUser} | [${dep} ➔ ${dest}] | 누적: ${myScannedVins.length}대`;
        document.getElementById("btn-show-list").classList.remove("hidden");
      }
    }

    function verifyPin() {
      const pin = document.getElementById("pin-input").value.trim();
      if (!pin) return alert("PIN 번호를 입력해주세요.");
      if (appData.users && appData.users[pin]) {
        currentUser = appData.users[pin]; currentMode = "YARD"; myScannedVins = []; 
        saveState();
        startScanner("🟢 야드 위치 등록 모드", `작업자: ${currentUser}`);
        document.getElementById("btn-show-list").classList.add("hidden"); 
      } else { alert("일치하는 PIN 번호가 없습니다."); }
    }

    function startGmMode() {
      const driver = document.getElementById("driver-input").value.trim();
      if (!driver) return alert("성함이나 호차 번호를 입력해주세요.");
      currentUser = driver; currentMode = "GM"; myScannedVins = []; 
      saveState();
      startScanner("🔵 광명 상차 진행 모드", `기사명: ${currentUser} | 광명 할당량: ${appData.gmLoadedCount}대 완료`);
      document.getElementById("btn-show-list").classList.remove("hidden"); 
    }

    function updatePortDropdowns() {
      const type = document.querySelector('input[name="portWorkType"]:checked').value;
      const depSelect = document.getElementById("port-departure");
      const destSelect = document.getElementById("port-destination");
      depSelect.innerHTML = '<option value="">출발지 선택</option>' + PORT_LOCATIONS[type].dep.map(v => `<option value="${v}">${v}</option>`).join('');
      destSelect.innerHTML = '<option value="">도착지 선택</option>' + PORT_LOCATIONS[type].dest.map(v => `<option value="${v}">${v}</option>`).join('');
    }

    function startPortMode() {
      const driver = document.getElementById("port-driver-input").value.trim();
      const dep = document.getElementById("port-departure").value;
      const dest = document.getElementById("port-destination").value;
      const typeName = document.querySelector('input[name="portWorkType"]:checked').value === 'port' ? '항작업' : '창고작업';

      if (!driver) return alert("기사명을 입력해주세요.");
      if (!dep || !dest) return alert("출발지와 도착지를 모두 선택해주세요.");
      
      currentUser = driver; currentMode = "PORT"; myScannedVins = []; 
      saveState();
      startScanner(`🟠 ${typeName} 스캔 모드`, `기사명: ${currentUser} | [${dep} ➔ ${dest}] | 누적: 0대`);
      document.getElementById("btn-show-list").classList.remove("hidden");
    }

    function startScanner(title, statusText) {
      showScreen("screen-scanner"); 
      document.getElementById("mode-title").innerText = title; 
      document.getElementById("status-bar").innerText = statusText;
      resetScanPanel();
    }

    function clearStateAndHome() {
      localStorage.removeItem('kain_currentUser');
      localStorage.removeItem('kain_currentMode');
      localStorage.removeItem('kain_myScannedVins');
      showScreen("screen-home"); 
      document.getElementById("pin-input").value = ""; document.getElementById("driver-input").value = ""; document.getElementById("port-driver-input").value = "";
    }

    function resetScanPanel() {
      document.getElementById("control-panel").classList.add("hidden");
      document.getElementById("location-input").value = ""; 
      document.getElementById("result-message").innerText = "";
      isProcessing = false;
    }

    function extractVin(rawText) {
      if (!rawText) return "";
      let cleanText = rawText.trim();
      const parts = cleanText.split(/[\|\,\;\s]+/);
      for (let p of parts) {
        let candidate = p.trim().toUpperCase();
        if (candidate.length === 17 && /^[A-HJ-NPR-Z0-9]{17}$/.test(candidate)) return candidate;
      }
      const match = cleanText.match(/[A-HJ-NPR-Z0-9]{17}/);
      if (match) return match[0].toUpperCase();
      if (cleanText.length >= 17) return cleanText.slice(-17).toUpperCase();
      return cleanText.toUpperCase();
    }

    function onScanSuccess(decodedText) {
      currentVin = extractVin(decodedText);
      
      const cp = document.getElementById("control-panel");
      cp.classList.remove("hidden");
      document.getElementById("vin-display").innerText = currentVin;
      
      const msg = document.getElementById("result-message"); 
      const group = document.getElementById("action-group"); 
      const locInput = document.getElementById("location-input"); 
      const actionBtn = document.getElementById("main-action-btn");
      
      group.classList.add("hidden"); locInput.classList.add("hidden");

      if(currentVin.length !== 17) {
         msg.className = "msg-error"; msg.innerText = "❌ 올바른 17자리 차대번호가 아닙니다.";
         return;
      }

      if (currentMode === "YARD") {
        if (appData.logs[currentVin]) { msg.className = "msg-warn"; msg.innerText = "⚠️ 이미 위치 등록 완료됨"; }
        else if (appData.gmTargets[currentVin]) { msg.className = "msg-blue"; msg.innerText = "🏢 [광명] 센터 배정 차량!"; group.classList.remove("hidden"); locInput.classList.remove("hidden"); actionBtn.innerText = "위치 저장"; locInput.focus(); }
        else if (appData.targets[currentVin]) { msg.className = "msg-success"; msg.innerText = "✅ 확인 (고객 인도 대상)"; group.classList.remove("hidden"); locInput.classList.remove("hidden"); actionBtn.innerText = "위치 저장"; locInput.focus(); }
        else { msg.className = "msg-error"; msg.innerText = "❌ 명단에 없는 차량"; }
      } else if (currentMode === "GM") {
        if (!appData.gmTargets[currentVin]) { msg.className = "msg-error"; msg.innerText = "❌ 광명딜리버리센터 운송 차량이 아닙니다."; }
        else if (appData.gmLogs[currentVin]) { msg.className = "msg-warn"; msg.innerText = "⚠️ 이미 상차 완료된 차량입니다."; }
        else { 
           msg.className = "msg-success"; msg.innerText = "🚀 상차 자동 처리 중... ⏳"; 
           processAction(); 
        }
      } else if (currentMode === "PORT") {
        const type = localStorage.getItem('kain_portWorkType') || document.querySelector('input[name="portWorkType"]:checked').value;
        const isAlreadyScanned = (type === 'port') ? (appData.portLogs && appData.portLogs[currentVin]) : (appData.whLogs && appData.whLogs[currentVin]);
        
        if (isAlreadyScanned) { 
           msg.className = "msg-warn"; msg.innerText = "⚠️ 이미 등록된 차량입니다."; 
        } else {
           msg.className = "msg-success"; msg.innerText = "🚀 설정된 정보로 자동 저장 중... ⏳"; 
           processAction(); 
        }
      }
    }

    function processAction() {
      const msg = document.getElementById("result-message"); 
      const safeVin = encodeURIComponent(currentVin); 
      const safeUser = encodeURIComponent(currentUser);

      if (currentMode === "YARD") {
        const loc = document.getElementById("location-input").value; if(!loc) { alert("위치를 입력하세요"); resetScanPanel(); return; }
        fetch(`${API_URL}?action=saveYard&vin=${safeVin}&loc=${encodeURIComponent(loc)}&worker=${safeUser}`).then(res => res.json())
          .then(res => { if(res.status === "SUCCESS") { appData.logs[currentVin] = true; alert("위치가 저장되었습니다."); resetScanPanel(); } }).catch(err => { alert("통신 오류"); resetScanPanel(); });
      } else if (currentMode === "GM") {
        fetch(`${API_URL}?action=saveGwangmyeong&vin=${safeVin}&driver=${safeUser}`).then(res => res.json())
          .then(res => {
             if(res.status === "SUCCESS") { 
                 appData.gmLogs[currentVin] = true; appData.gmLoadedCount++; myScannedVins.push(currentVin); 
                 saveState(); 
                 document.getElementById("status-bar").innerText = `기사명: ${currentUser} | 광명 할당량: ${appData.gmLoadedCount}대 완료`;
                 msg.className = "msg-success";
                 msg.innerText = `✅ [상차완료] ${currentVin}`;
                 setTimeout(() => { resetScanPanel(); }, 1200); 
             }
          }).catch(err => { alert("통신 오류"); resetScanPanel(); });
      } else if (currentMode === "PORT") {
        const type = localStorage.getItem('kain_portWorkType') || 'port';
        const actionType = type === 'port' ? 'savePort' : 'saveWarehouse';
        const dep = encodeURIComponent(localStorage.getItem('kain_portDep') || '');
        const dest = encodeURIComponent(localStorage.getItem('kain_portDest') || '');

        fetch(`${API_URL}?action=${actionType}&vin=${safeVin}&departure=${dep}&destination=${dest}&driver=${safeUser}`)
          .then(res => res.json())
          .then(res => {
             if(res.status === "SUCCESS") { 
                 if(type === 'port') { if(!appData.portLogs) appData.portLogs = {}; appData.portLogs[currentVin] = true; } 
                 else { if(!appData.whLogs) appData.whLogs = {}; appData.whLogs[currentVin] = true; }
                 
                 myScannedVins.push(currentVin);
                 saveState(); 
                 
                 const depStr = decodeURIComponent(dep);
                 const destStr = decodeURIComponent(dest);
                 document.getElementById("status-bar").innerText = `기사명: ${currentUser} | [${depStr} ➔ ${destStr}] | 누적: ${myScannedVins.length}대`;
                 
                 msg.className = "msg-success";
                 msg.innerText = `✅ [저장완료] ${currentVin} (누적: ${myScannedVins.length}대)`;
                 
                 setTimeout(() => { resetScanPanel(); }, 1200); 
             }
          }).catch(err => { alert("통신 오류"); resetScanPanel(); });
      }
    }

    function showMyList() {
      const ul = document.getElementById("my-list-ul"); ul.innerHTML = "";
      if (myScannedVins.length === 0) { ul.innerHTML = "<li style='text-align:center; color:#999; display:block;'>아직 상차한 차량이 없습니다.</li>"; } 
      else {
        myScannedVins.forEach((vin, index) => {
          const btnHtml = currentMode === "GM" ? `<button class="btn-delete" onclick="deleteVin('${vin}')">취소</button>` : `<span style="color:#888; font-size:14px;">(등록됨)</span>`;
          ul.innerHTML += `
            <li>
              <span>${index + 1}번째 차량 <strong>${vin}</strong></span>
              ${btnHtml}
            </li>`;
        });
      }
      document.getElementById("my-list-count").innerText = myScannedVins.length;
      document.getElementById("screen-scanner").classList.add("hidden"); document.getElementById("screen-my-list").classList.remove("hidden");
    }

    function hideMyList() {
      document.getElementById("screen-my-list").classList.add("hidden"); document.getElementById("screen-scanner").classList.remove("hidden");
    }

    function deleteVin(vin) {
      if(!confirm(`[${vin}]\n정말 이 차량의 상차를 취소하시겠습니까?\n(시트에서도 삭제됩니다)`)) return;
      
      const safeVin = encodeURIComponent(vin);
      document.getElementById("my-list-ul").innerHTML = "<li style='text-align:center; display:block;'>삭제 처리 중... ⏳</li>";
      
      fetch(`${API_URL}?action=deleteGwangmyeong&vin=${safeVin}`)
        .then(res => res.json())
        .then(res => {
           if(res.status === "SUCCESS") {
               myScannedVins = myScannedVins.filter(v => v !== vin);
               saveState(); 
               delete appData.gmLogs[vin]; 
               appData.gmLoadedCount--;
               document.getElementById("status-bar").innerText = `기사명: ${currentUser} | 광명 할당량: ${appData.gmLoadedCount}대 완료`;
               alert("정상적으로 상차 취소(삭제) 되었습니다.");
               showMyList();
           }
        }).catch(err => {
           alert("통신 오류가 발생했습니다. 잠시 후 다시 시도해주세요.");
           showMyList(); 
        });
    }
  </script>
</body>
</html>
