<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Tesla Hybrid Scanner V3</title>
  <style>
    body { font-family: -apple-system, sans-serif; padding: 10px; text-align: center; background-color: #f0f2f5; margin: 0; overflow-x: hidden; }
    h2, h3 { margin: 10px 0; color: #333; }
    .hidden { display: none !important; }
    
    #screen-loading, #screen-home, #screen-auth-yard, #screen-auth-gm, #screen-auth-port, #screen-scanner, #screen-my-list {
      max-width: 500px; margin: 0 auto; padding: 20px; background: white; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); box-sizing: border-box; margin-top: 20px;
    }
    
    button { width: 100%; padding: 16px; font-size: 18px; font-weight: bold; border: none; border-radius: 10px; cursor: pointer; margin-top: 10px; transition: 0.2s; }
    .btn-yard { background-color: #28a745; color: white; }
    .btn-gm { background-color: #007bff; color: white; }
    .btn-port { background-color: #fd7e14; color: white; } 
    .btn-save { background-color: #ff9800; color: white; }
    .btn-cancel { background-color: #6c757d; color: white; }
    .btn-home { background-color: #f8f9fa; color: #333; border: 1px solid #ddd; margin-top: 20px; }
    .btn-list { background-color: #17a2b8; color: white; margin-top: 15px; } 
    .btn-manual { background-color: #6f42c1; color: white; }
    
    input, select { width: 100%; padding: 15px; margin: 10px 0; font-size: 18px; border: 2px solid #ddd; border-radius: 8px; text-align: center; box-sizing: border-box; }
    
    #scanner-wrapper { position: relative; width: 100%; border-radius: 10px; overflow: hidden; background: #000; min-height: 250px; margin-top: 15px; }
    #scanner-video { width: 100%; display: block; background: #000; }
    .camera-dimmed { opacity: 0.2; pointer-events: none; }
    
    #control-panel { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 90%; background: rgba(255, 255, 255, 0.95); padding: 20px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); box-sizing: border-box; z-index: 10; display: none; }
    #vin-display { font-size: 1.2em; color: #000; }
    
    .msg-error { color: #dc3545; font-size: 1.2em; font-weight: bold; margin: 10px 0; }
    .msg-warn { color: #ffc107; font-size: 1.2em; font-weight: bold; margin: 10px 0; }
    .msg-success { color: #28a745; font-size: 1.2em; font-weight: bold; margin: 10px 0; }
    .msg-blue { color: #0056b3; font-size: 1.2em; font-weight: bold; margin: 10px 0; background-color: #e3f2fd; padding: 10px; border-radius: 8px; }
    
    #status-bar { margin-top: 10px; font-weight: bold; color: #555; }
    .company-logo { width: 150px; height: auto; margin-bottom: 10px; } 
    .tesla-red { color: #cc0000; font-weight: bold; } 
    
    #my-list-ul { list-style: none; padding: 0; text-align: left; background: #fafafa; border-radius: 8px; border: 1px solid #ddd; max-height: 350px; overflow-y: auto; margin-top: 15px; }
    #my-list-ul li { padding: 12px; border-bottom: 1px solid #eee; font-size: 16px; color: #333; display: flex; justify-content: space-between; align-items: center; }
    #my-list-ul li:last-child { border-bottom: none; }
    #my-list-ul li strong { font-size: 18px; color: #0056b3; display: block; margin-top: 3px;}
    .btn-delete { width: auto; padding: 8px 15px; margin: 0; background-color: #dc3545; color: white; font-size: 14px; border-radius: 5px; }

    #zoom-slider { width: 92%; margin: 15px auto 0; display: block; accent-color: #fd7e14; }
    #focus-slider { width: 92%; margin: 15px auto 0; display: block; accent-color: #28a745; }
    #torch-btn { background-color: #343a40; color: #fff; width: auto; padding: 10px 22px; margin: 12px auto 0; display: block; font-size: 15px; }
    #engine-status { font-size: 12px; color: #999; margin-top: 6px; }
    #focus-label { font-size: 13px; color: #666; margin-top: 10px; }
    #camera-debug { text-align: left; font-size: 11px; background: #f8f9fa; padding: 10px; border-radius: 8px; margin-top: 10px; white-space: pre-wrap; word-break: break-all; max-height: 200px; overflow-y: auto; border: 1px solid #ddd; }
    .btn-debug { background-color: #495057; color: white; }
  </style>
  <!-- html5-qrcode 제거, jsQR을 직접 제어하여 해상도/전처리/폴백을 전부 커스텀 제어 -->
  <script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>
</head>
<body>

  <div id="screen-loading">
    <h3>🔄 시스템 연결 중...</h3><p>최신 데이터를 불러오고 있습니다.</p>
  </div>

  <div id="screen-home" class="hidden">
    <img src="https://i.postimg.cc/7LSzLXw1/2024-dongbu-logo.png" alt="회사 로고" class="company-logo">
    <h2><span class="tesla-red">TESLA</span> QR 스캐너</h2><p>작업하실 모드를 선택해주세요.</p>
    <button class="btn-yard" onclick="showScreen('screen-auth-yard')">🟢 야드 위치 등록 (직원용)</button>
    <button class="btn-gm" onclick="showScreen('screen-auth-gm')">🔵 광명 상차 진행 (기사용)</button>
    <button class="btn-port" onclick="showScreen('screen-auth-port')">🟠 항/창고 작업 (기사용)</button>
  </div>

  <div id="screen-auth-yard" class="hidden">
    <h3>🟢 직원 인증</h3><p>부여받은 PIN 번호(4자리)를 입력하세요.</p>
    <input type="password" id="pin-input" placeholder="PIN 번호 입력" inputmode="numeric" />
    <button class="btn-yard" onclick="verifyPin()">확인 및 시작</button>
    <button class="btn-home" onclick="showScreen('screen-home')">🔙 처음으로</button>
  </div>

  <div id="screen-auth-gm" class="hidden">
    <h3>🔵 기사 정보 입력</h3><p>상차 기록을 위해 성함(또는 호차)을 입력하세요.</p>
    <input type="text" id="driver-input" placeholder="예: 홍길동 (또는 1호차)" />
    <button class="btn-gm" onclick="startGmMode()">확인 및 시작</button>
    <button class="btn-home" onclick="showScreen('screen-home')">🔙 처음으로</button>
  </div>

  <div id="screen-auth-port" class="hidden">
    <h3>🟠 항/창고 작업 설정</h3><p>작업 정보를 확인하고 선택해주세요.</p>
    <input type="text" id="port-driver-input" placeholder="기사명 입력 (예: 홍길동)" />
    
    <div style="display: flex; justify-content: space-around; align-items: center; background: #fafafa; padding: 15px; border-radius: 8px; border: 1px solid #ddd; margin: 10px 0;">
      <label style="font-size: 16px; font-weight: bold; display: flex; align-items: center; gap: 8px; cursor: pointer;">
        <input type="radio" name="portWorkType" value="port" checked onchange="updatePortDropdowns()" style="width: 20px; height: 20px; margin: 0;"> 항작업 스캔
      </label>
      <label style="font-size: 16px; font-weight: bold; display: flex; align-items: center; gap: 8px; cursor: pointer;">
        <input type="radio" name="portWorkType" value="warehouse" onchange="updatePortDropdowns()" style="width: 20px; height: 20px; margin: 0;"> 창고작업 스캔
      </label>
    </div>

    <select id="port-departure"></select>
    <select id="port-destination"></select>

    <button class="btn-port" onclick="startPortMode()">확인 및 스캔 시작</button>
    <button class="btn-home" onclick="showScreen('screen-home')">🔙 처음으로</button>
  </div>

  <div id="screen-scanner" class="hidden">
    <h3 id="mode-title">스캐너 작동 중</h3>
    <div id="status-bar"></div>
    <div id="scanner-wrapper">
      <video id="scanner-video" playsinline muted autoplay></video>
      <div id="control-panel">
        <p style="margin-top:0;">차대번호: <strong id="vin-display"></strong></p>
        <div id="result-message"></div>
        <div id="action-group" class="hidden">
          <input type="text" id="location-input" class="hidden" placeholder="위치 입력 (예: A-1)" autocomplete="off" />
          <button id="main-action-btn" class="btn-save" onclick="processAction()">저장 하기</button>
        </div>
        <button class="btn-cancel" onclick="resumeScanning()">다시 스캔 (취소)</button>
      </div>
    </div>

    <div id="focus-label" class="hidden">🔍 초점 거리 (왼쪽=가까이, 오른쪽=멀리)</div>
    <input type="range" id="focus-slider" class="hidden" min="0" max="1" step="0.01" value="0" oninput="onFocusInput(this.value)">
    <input type="range" id="zoom-slider" class="hidden" min="1" max="5" step="0.1" value="1" oninput="onZoomInput(this.value)">
    <button id="torch-btn" class="hidden">💡 조명 켜기</button>
    <div id="engine-status"></div>
    <div id="camera-debug" class="hidden"></div>

    <button id="btn-show-list" class="btn-list hidden" onclick="showMyList()">📋 내가 상차한 차량 보기</button>
    <button class="btn-manual" onclick="manualVinEntry()">⌨️ 차대번호 직접 입력 (QR 완전 손상 시)</button>
    <button class="btn-debug" onclick="switchCamera()">🔁 다른 카메라 렌즈로 전환</button>
    <button class="btn-debug" onclick="toggleCameraDebug()">🔧 카메라 상세정보 보기 (문제 보고용)</button>
    <button class="btn-debug" onclick="copyCameraDebug()">📋 위 정보 복사하기 (채팅에 붙여넣기용)</button>
    <button class="btn-home" onclick="stopScannerAndHome()">🔙 모드 다시 선택하기</button>
  </div>

  <div id="screen-my-list" class="hidden">
    <h3>📋 내 상차 목록 (<span id="my-list-count">0</span>대)</h3>
    <ul id="my-list-ul"></ul>
    <button class="btn-gm" onclick="hideMyList()">📸 다시 스캐너로 돌아가기</button>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzP9rkRFf30-UBwDZkYzLrcelBiZdX_x_9G3I0ae1PqgBo3FYxSiE8_yNQSqZPB8pNYgA/exec";

    let appData = null; let currentMode = ""; let currentUser = ""; let currentVin = ""; let isProcessing = false;
    let myScannedVins = [];

    // ===== 커스텀 스캐너 코어 상태 =====
    let mediaStream = null;
    let videoTrack = null;
    let imageCaptureRef = null;
    let rafId = null;
    let isDecodePaused = false;
    let failStreak = 0;
    let lastStillAttemptTime = 0;
    let lastDecodeAttempt = 0;
    let nativeDetector = null;
    if ("BarcodeDetector" in window) {
      try { nativeDetector = new BarcodeDetector({ formats: ["qr_code"] }); } catch (e) { nativeDetector = null; }
    }
    let availableCams = []; let currentCamIndex = -1;
    
    const PORT_LOCATIONS = {
      port: { dep: ["PIRT", "HPIT"], dest: ["PH선광", "배후부지", "AMF(서울우유)", "PCTC(한진)"] },
      warehouse: { dep: ["배후부지", "AMF(서울우유)", "PCTC(한진)"], dest: ["PH선광", "배후부지", "AMF(서울우유)", "PCTC(한진)"] }
    };

    window.onload = function() {
      updatePortDropdowns(); 
      document.getElementById("engine-status").innerText =
        (nativeDetector ? "네이티브 디코더 사용 가능 · " : "") + (window.ImageCapture ? "고해상도 정지사진 폴백 사용 가능" : "");
      fetch(API_URL + "?action=getData").then(res => res.json()).then(data => { appData = data; showScreen("screen-home"); })
        .catch(err => { document.getElementById("screen-loading").innerHTML = "<h3 class='msg-error'>❌ 데이터 연결 실패</h3>"; });
    };

    function showScreen(screenId) { document.querySelectorAll("body > div").forEach(div => div.classList.add("hidden")); document.getElementById(screenId).classList.remove("hidden"); }

    function verifyPin() {
      const pin = document.getElementById("pin-input").value.trim();
      if (!pin) return alert("PIN 번호를 입력해주세요.");
      if (appData.users && appData.users[pin]) {
        currentUser = appData.users[pin]; currentMode = "YARD"; myScannedVins = []; 
        startScanner("🟢 야드 위치 등록 모드", `작업자: ${currentUser}`);
        document.getElementById("btn-show-list").classList.add("hidden"); 
      } else { alert("일치하는 PIN 번호가 없습니다."); }
    }

    function startGmMode() {
      const driver = document.getElementById("driver-input").value.trim();
      if (!driver) return alert("성함이나 호차 번호를 입력해주세요.");
      currentUser = driver; currentMode = "GM"; myScannedVins = []; 
      startScanner("🔵 광명 상차 진행 모드", `기사명: ${currentUser} | 광명 할당량: ${appData.gmLoadedCount}대 완료`);
      document.getElementById("btn-show-list").classList.remove("hidden"); 
    }

    function updatePortDropdowns() {
      const type = document.querySelector('input[name="portWorkType"]:checked').value;
      const depSelect = document.getElementById("port-departure");
      const destSelect = document.getElementById("port-destination");
      
      depSelect.innerHTML = '<option value="">출발지 선택</option>' + PORT_LOCATIONS[type].dep.map(v => `<option value="${v}">${v}</option>`).join('');
      destSelect.innerHTML = '<option value="">도착지 선택</option>' + PORT_LOCATIONS[type].dest.map(v => `<option value="${v}">${v}</option>`).join('');
    }

    function startPortMode() {
      const driver = document.getElementById("port-driver-input").value.trim();
      const dep = document.getElementById("port-departure").value;
      const dest = document.getElementById("port-destination").value;
      const typeName = document.querySelector('input[name="portWorkType"]:checked').value === 'port' ? '항작업' : '창고작업';

      if (!driver) return alert("기사명을 입력해주세요.");
      if (!dep || !dest) return alert("출발지와 도착지를 모두 선택해주세요.");
      
      currentUser = driver; currentMode = "PORT"; myScannedVins = []; 
      startScanner(`🟠 ${typeName} 스캔 모드`, `기사명: ${currentUser} | 누적: 0대`);
      document.getElementById("btn-show-list").classList.remove("hidden");
    }

    // ================= 커스텀 카메라 + 디코딩 코어 =================
    async function startScanner(title, statusText) {
      showScreen("screen-scanner");
      document.getElementById("mode-title").innerText = title;
      document.getElementById("status-bar").innerText = statusText;
      failStreak = 0; isDecodePaused = false;

      const video = document.getElementById("scanner-video");
      video.classList.remove("camera-dimmed");

      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            // 최대한 높은 해상도를 요청 -> 작은 QR도 픽셀 정보가 풍부해짐 (기기 지원 범위 내에서 자동 조정됨)
            width: { min: 1280, ideal: 3840 },
            height: { min: 720, ideal: 2160 },
            advanced: [{ focusMode: "continuous" }]
          },
          audio: false
        });
        videoTrack = mediaStream.getVideoTracks()[0];
        video.srcObject = mediaStream;
        await video.play();

        imageCaptureRef = null;
        if (window.ImageCapture) {
          try { imageCaptureRef = new ImageCapture(videoTrack); } catch (e) { imageCaptureRef = null; }
        }

        setupZoomControl();
        setupTorchControl();
        setupFocusControl();
        refreshCameraList();

        lastDecodeAttempt = 0;
        rafId = requestAnimationFrame(decodeLoop);
      } catch (err) {
        alert("카메라 에러: " + err);
      }
    }

    // 사용 가능한 카메라 렌즈 목록 갱신 (권한 허용 후에만 label이 채워짐)
    async function refreshCameraList() {
      try {
        const devices = await navigator.mediaDevices.enumerateDevices();
        availableCams = devices.filter(d => d.kind === "videoinput");
      } catch (e) { availableCams = []; }
    }

    // 여러 후면 렌즈(광각/초광각/망원 등)가 잡히는 기기에서, 매크로 초점이 더 잘 되는
    // 렌즈로 수동 전환해볼 수 있게 함 (facingMode:"environment"는 기본 렌즈만 선택하는 경우가 많음)
    async function switchCamera() {
      if (availableCams.length === 0) await refreshCameraList();
      if (availableCams.length <= 1) { alert("이 기기/브라우저에서는 전환 가능한 다른 카메라가 감지되지 않았습니다."); return; }

      currentCamIndex = (currentCamIndex + 1) % availableCams.length;
      const chosen = availableCams[currentCamIndex];

      if (mediaStream) mediaStream.getTracks().forEach(t => t.stop());
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { deviceId: { exact: chosen.deviceId }, width: { ideal: 3840 }, height: { ideal: 2160 } },
          audio: false
        });
        videoTrack = mediaStream.getVideoTracks()[0];
        const video = document.getElementById("scanner-video");
        video.srcObject = mediaStream;
        await video.play();
        imageCaptureRef = window.ImageCapture ? (function(){ try { return new ImageCapture(videoTrack); } catch(e){ return null; } })() : null;
        setupZoomControl(); setupTorchControl(); setupFocusControl();
        alert("카메라 전환됨: " + (chosen.label || ("카메라 " + (currentCamIndex + 1) + "/" + availableCams.length)));
      } catch (e) {
        alert("전환 실패: " + e);
      }
    }

    // 수동 초점 거리 제어 - 기기가 focusDistance를 노출하는 경우에만 슬라이더 표시
    // 우리 용도는 항상 근접 촬영이므로 시작 시 기본값을 "가까이" 쪽으로 맞춰둠
    function setupFocusControl() {
      const slider = document.getElementById("focus-slider");
      const label = document.getElementById("focus-label");
      try {
        const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
        if (caps.focusDistance) {
          slider.min = caps.focusDistance.min; slider.max = caps.focusDistance.max; slider.step = caps.focusDistance.step || 0.01;
          const nearValue = caps.focusDistance.min;
          slider.value = nearValue;
          slider.classList.remove("hidden"); label.classList.remove("hidden");
          videoTrack.applyConstraints({ advanced: [{ focusMode: "manual", focusDistance: nearValue }] }).catch(() => {});
        } else {
          slider.classList.add("hidden"); label.classList.add("hidden");
        }
      } catch (e) {
        slider.classList.add("hidden"); label.classList.add("hidden");
      }
    }

    function onFocusInput(value) {
      if (videoTrack) videoTrack.applyConstraints({ advanced: [{ focusMode: "manual", focusDistance: parseFloat(value) }] }).catch(() => {});
    }

    // 이 기기의 카메라가 브라우저에 실제로 어떤 제어권을 넘겨주는지 그대로 확인 (문제 보고 시 이 내용을 캡처해서 공유해주면 정확한 진단 가능)
    function toggleCameraDebug() {
      const el = document.getElementById("camera-debug");
      let caps = {};
      try { caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {}; } catch (e) {}
      el.innerText = "기기: " + navigator.userAgent + "\n\n선택된 카메라: " + (availableCams[currentCamIndex] ? availableCams[currentCamIndex].label : "기본") +
        "\n\n카메라 능력치(getCapabilities):\n" + JSON.stringify(caps, null, 2);
      el.classList.toggle("hidden");
    }

    function copyCameraDebug() {
      const el = document.getElementById("camera-debug");
      if (el.classList.contains("hidden") || !el.innerText) { toggleCameraDebug(); }
      const text = document.getElementById("camera-debug").innerText;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
          .then(() => alert("복사되었습니다. 채팅창에 붙여넣어 주세요."))
          .catch(() => alert("복사 실패 - 화면을 스크롤하며 캡처해서 보내주세요."));
      } else {
        alert("이 브라우저는 자동 복사가 지원 안 됩니다 - 화면을 스크롤하며 캡처해서 보내주세요.");
      }
    }

    async function decodeLoop() {
      if (isProcessing || isDecodePaused) { rafId = requestAnimationFrame(decodeLoop); return; }

      const now = performance.now();
      if (now - lastDecodeAttempt < 90) { rafId = requestAnimationFrame(decodeLoop); return; } // 약 10~11fps로 제한 (배터리/발열 보호)
      lastDecodeAttempt = now;

      const video = document.getElementById("scanner-video");
      if (!video.videoWidth || video.readyState < 2) { rafId = requestAnimationFrame(decodeLoop); return; }

      const canvas = getScratchCanvas();
      const ctx = canvas.getContext("2d", { willReadFrequently: true });

      // 화면 중앙 85% 영역만 잘라서 디코딩 (실제 촬영 해상도 기준 크롭이라 화질 손실 없음)
      const vw = video.videoWidth, vh = video.videoHeight;
      const boxSize = Math.floor(Math.min(vw, vh) * 0.85);
      const sx = Math.floor((vw - boxSize) / 2);
      const sy = Math.floor((vh - boxSize) / 2);
      canvas.width = boxSize; canvas.height = boxSize;
      ctx.drawImage(video, sx, sy, boxSize, boxSize, 0, 0, boxSize, boxSize);

      let decoded = await tryDecodeCanvas(canvas, ctx);

      if (decoded) {
        failStreak = 0;
        onScanSuccess(decoded);
      } else {
        failStreak++;
        // 연속 실패가 약 1초 이상 누적되면, 센서 최대 해상도 정지사진으로 한 번 더 시도 (안드로이드 크롬 등 지원 기기만 작동)
        if (imageCaptureRef && failStreak > 11 && now - lastStillAttemptTime > 1200) {
          lastStillAttemptTime = now;
          tryHighResStillDecode();
        }
      }

      rafId = requestAnimationFrame(decodeLoop);
    }

    function getScratchCanvas() {
      if (!getScratchCanvas._c) getScratchCanvas._c = document.createElement("canvas");
      return getScratchCanvas._c;
    }

    async function tryDecodeCanvas(canvas, ctx) {
      // 1순위: 브라우저 네이티브 디코더 (지원 기기에서 jsQR보다 정확도 높음)
      if (nativeDetector) {
        try {
          const results = await nativeDetector.detect(canvas);
          if (results && results.length > 0) return results[0].rawValue;
        } catch (e) { /* 무시하고 jsQR로 폴백 */ }
      }
      // 2순위: jsQR + 대비 강화 전처리
      if (window.jsQR) {
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        enhanceContrast(imageData);
        const result = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: "attemptBoth" });
        if (result) return result.data;
      }
      return null;
    }

    // 명암 대비를 늘려서(히스토그램 스트레칭) 흐리거나 인쇄 품질 낮은 QR의 인식률을 올림
    function enhanceContrast(imageData) {
      const data = imageData.data;
      let min = 255, max = 0;
      for (let i = 0; i < data.length; i += 4) {
        const lum = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
        if (lum < min) min = lum;
        if (lum > max) max = lum;
      }
      const range = max - min || 1;
      for (let i = 0; i < data.length; i += 4) {
        for (let c = 0; c < 3; c++) {
          data[i + c] = Math.min(255, Math.max(0, ((data[i + c] - min) / range) * 255));
        }
      }
    }

    // 센서 최대 해상도 정지사진 캡처 후 재시도 (영상 스트림보다 훨씬 고화질)
    async function tryHighResStillDecode() {
      try {
        const blob = await imageCaptureRef.takePhoto();
        const bitmap = await createImageBitmap(blob);
        const size = Math.floor(Math.min(bitmap.width, bitmap.height) * 0.6);
        const sx = Math.floor((bitmap.width - size) / 2);
        const sy = Math.floor((bitmap.height - size) / 2);

        const stillCanvas = document.createElement("canvas");
        stillCanvas.width = size; stillCanvas.height = size;
        const sctx = stillCanvas.getContext("2d", { willReadFrequently: true });
        sctx.drawImage(bitmap, sx, sy, size, size, 0, 0, size, size);

        const decoded = await tryDecodeCanvas(stillCanvas, sctx);
        if (decoded) { failStreak = 0; onScanSuccess(decoded); }
      } catch (e) {
        console.log("고해상도 정지사진 캡처 미지원/실패 (일부 기기·브라우저는 정상적으로 건너뜀):", e);
      }
    }

    function setupZoomControl() {
      const slider = document.getElementById("zoom-slider");
      try {
        const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
        if (caps.zoom) {
          slider.min = caps.zoom.min; slider.max = caps.zoom.max; slider.step = caps.zoom.step || 0.1;
          slider.value = caps.zoom.min; slider.classList.remove("hidden");
        } else { slider.classList.add("hidden"); }
      } catch (e) { slider.classList.add("hidden"); }
    }

    function onZoomInput(value) {
      if (videoTrack) videoTrack.applyConstraints({ advanced: [{ zoom: parseFloat(value) }] }).catch(() => {});
    }

    function setupTorchControl() {
      const btn = document.getElementById("torch-btn");
      let torchOn = false;
      try {
        const caps = videoTrack.getCapabilities ? videoTrack.getCapabilities() : {};
        if (caps.torch) {
          btn.classList.remove("hidden"); btn.innerText = "💡 조명 켜기";
          btn.onclick = () => {
            torchOn = !torchOn;
            videoTrack.applyConstraints({ advanced: [{ torch: torchOn }] }).catch(() => {});
            btn.innerText = torchOn ? "💡 조명 끄기" : "💡 조명 켜기";
          };
        } else { btn.classList.add("hidden"); }
      } catch (e) { btn.classList.add("hidden"); }
    }

    function manualVinEntry() {
      const vin = prompt("QR이 완전히 손상되어 인식이 불가능한 경우에만 사용하세요.\n차대번호(VIN)를 입력하세요:");
      if (vin && vin.trim()) onScanSuccess(vin.trim());
    }

    function stopScannerAndHome() {
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;
      if (mediaStream) { mediaStream.getTracks().forEach(t => t.stop()); mediaStream = null; }
      videoTrack = null; imageCaptureRef = null;
      showScreen("screen-home");
      document.getElementById("pin-input").value = ""; document.getElementById("driver-input").value = ""; document.getElementById("port-driver-input").value = "";
      document.getElementById("zoom-slider").classList.add("hidden");
      document.getElementById("torch-btn").classList.add("hidden");
      document.getElementById("focus-slider").classList.add("hidden");
      document.getElementById("focus-label").classList.add("hidden");
      document.getElementById("camera-debug").classList.add("hidden");
      currentCamIndex = -1;
    }

    function onScanSuccess(decodedText) {
      if (isProcessing || !appData) return; isProcessing = true; 
      
      const parts = decodedText.split('|');
      currentVin = parts[parts.length - 1].trim().toUpperCase();
      
      document.getElementById("scanner-video").classList.add("camera-dimmed"); document.getElementById("control-panel").style.display = "block"; document.getElementById("vin-display").innerText = currentVin;
      
      const msg = document.getElementById("result-message"); const group = document.getElementById("action-group"); const locInput = document.getElementById("location-input"); const actionBtn = document.getElementById("main-action-btn");
      group.classList.add("hidden"); locInput.classList.add("hidden");

      if(currentVin.length !== 17) {
         msg.className = "msg-error"; msg.innerText = "❌ 올바른 17자리 차대번호가 아닙니다.";
         return;
      }

      if (currentMode === "YARD") {
        if (appData.logs[currentVin]) { msg.className = "msg-warn"; msg.innerText = "⚠️ 이미 위치 등록 완료됨"; }
        else if (appData.gmTargets[currentVin]) { msg.className = "msg-blue"; msg.innerText = "🏢 [광명] 센터 배정 차량!"; group.classList.remove("hidden"); locInput.classList.remove("hidden"); actionBtn.innerText = "위치 저장"; locInput.focus(); }
        else if (appData.targets[currentVin]) { msg.className = "msg-success"; msg.innerText = "✅ 확인 (고객 인도 대상)"; group.classList.remove("hidden"); locInput.classList.remove("hidden"); actionBtn.innerText = "위치 저장"; locInput.focus(); }
        else { msg.className = "msg-error"; msg.innerText = "❌ 명단에 없는 차량"; }
      } else if (currentMode === "GM") {
        if (!appData.gmTargets[currentVin]) { msg.className = "msg-error"; msg.innerText = "❌ 광명딜리버리센터 운송 차량이 아닙니다."; }
        else if (appData.gmLogs[currentVin]) { msg.className = "msg-warn"; msg.innerText = "⚠️ 이미 상차 완료된 차량입니다."; }
        else { msg.className = "msg-success"; msg.innerText = "✅ 상차 가능 차량"; group.classList.remove("hidden"); actionBtn.innerText = "상차 완료"; }
      } else if (currentMode === "PORT") {
        const type = document.querySelector('input[name="portWorkType"]:checked').value;
        const isAlreadyScanned = (type === 'port') ? (appData.portLogs && appData.portLogs[currentVin]) : (appData.whLogs && appData.whLogs[currentVin]);
        
        if (isAlreadyScanned) { 
           msg.className = "msg-warn"; msg.innerText = "⚠️ 이미 등록된 차량입니다."; 
        } else {
           msg.className = "msg-success"; msg.innerText = "✅ 정상 차량 확인"; 
           group.classList.remove("hidden"); actionBtn.innerText = "저장 하기";
        }
      }
    }

    function processAction() {
      const msg = document.getElementById("result-message"); const group = document.getElementById("action-group");
      group.classList.add("hidden"); msg.className = "msg-warn"; msg.innerText = "저장 중... ⏳";
      const safeVin = encodeURIComponent(currentVin); const safeUser = encodeURIComponent(currentUser);

      if (currentMode === "YARD") {
        const loc = document.getElementById("location-input").value; if(!loc) { alert("위치를 입력하세요"); resumeScanning(); return; }
        fetch(`${API_URL}?action=saveYard&vin=${safeVin}&loc=${encodeURIComponent(loc)}&worker=${safeUser}`).then(res => res.json())
          .then(res => { if(res.status === "SUCCESS") { appData.logs[currentVin] = true; resumeScanning(); } }).catch(err => { alert("통신 오류"); resumeScanning(); });
      } else if (currentMode === "GM") {
        fetch(`${API_URL}?action=saveGwangmyeong&vin=${safeVin}&driver=${safeUser}`).then(res => res.json())
          .then(res => {
             if(res.status === "SUCCESS") { 
                 appData.gmLogs[currentVin] = true; appData.gmLoadedCount++; myScannedVins.push(currentVin); 
                 document.getElementById("status-bar").innerText = `기사명: ${currentUser} | 광명 할당량: ${appData.gmLoadedCount}대 완료`;
                 alert("상차 처리되었습니다.\n(누적: " + myScannedVins.length + "대)"); resumeScanning(); 
             }
          }).catch(err => { alert("통신 오류"); resumeScanning(); });
      } else if (currentMode === "PORT") {
        const type = document.querySelector('input[name="portWorkType"]:checked').value;
        const actionType = type === 'port' ? 'savePort' : 'saveWarehouse';
        const dep = encodeURIComponent(document.getElementById("port-departure").value);
        const dest = encodeURIComponent(document.getElementById("port-destination").value);

        fetch(`${API_URL}?action=${actionType}&vin=${safeVin}&departure=${dep}&destination=${dest}&driver=${safeUser}`)
          .then(res => res.json())
          .then(res => {
             if(res.status === "SUCCESS") { 
                 if(type === 'port') { if(!appData.portLogs) appData.portLogs = {}; appData.portLogs[currentVin] = true; } 
                 else { if(!appData.whLogs) appData.whLogs = {}; appData.whLogs[currentVin] = true; }
                 
                 myScannedVins.push(currentVin);
                 document.getElementById("status-bar").innerText = `기사명: ${currentUser} | 누적: ${myScannedVins.length}대`;
                 alert("정상적으로 저장되었습니다.\n(누적: " + myScannedVins.length + "대)"); 
                 resumeScanning(); 
             }
          }).catch(err => { alert("통신 오류"); resumeScanning(); });
      }
    }

    function resumeScanning() {
      document.getElementById("control-panel").style.display = "none"; document.getElementById("location-input").value = ""; document.getElementById("result-message").innerText = ""; document.getElementById("scanner-video").classList.remove("camera-dimmed");
      failStreak = 0;
      setTimeout(() => { isProcessing = false; }, 400);
    }

    function showMyList() {
      const ul = document.getElementById("my-list-ul"); ul.innerHTML = "";
      if (myScannedVins.length === 0) { ul.innerHTML = "<li style='text-align:center; color:#999; display:block;'>아직 상차한 차량이 없습니다.</li>"; } 
      else {
        myScannedVins.forEach((vin, index) => {
          const btnHtml = currentMode === "GM" ? `<button class="btn-delete" onclick="deleteVin('${vin}')">취소</button>` : `<span style="color:#888; font-size:14px;">(등록됨)</span>`;
          ul.innerHTML += `
            <li>
              <span>${index + 1}번째 차량 <strong>${vin}</strong></span>
              ${btnHtml}
            </li>`;
        });
      }
      document.getElementById("my-list-count").innerText = myScannedVins.length;
      document.getElementById("screen-scanner").classList.add("hidden"); document.getElementById("screen-my-list").classList.remove("hidden");
      isDecodePaused = true;
    }

    function hideMyList() {
      document.getElementById("screen-my-list").classList.add("hidden"); document.getElementById("screen-scanner").classList.remove("hidden");
      isDecodePaused = false;
    }

    function deleteVin(vin) {
      if(!confirm(`[${vin}]\n정말 이 차량의 상차를 취소하시겠습니까?\n(시트에서도 삭제됩니다)`)) return;
      
      const safeVin = encodeURIComponent(vin);
      document.getElementById("my-list-ul").innerHTML = "<li style='text-align:center; display:block;'>삭제 처리 중... ⏳</li>";
      
      fetch(`${API_URL}?action=deleteGwangmyeong&vin=${safeVin}`)
        .then(res => res.json())
        .then(res => {
           if(res.status === "SUCCESS") {
               myScannedVins = myScannedVins.filter(v => v !== vin);
               delete appData.gmLogs[vin]; 
               appData.gmLoadedCount--;
               document.getElementById("status-bar").innerText = `기사명: ${currentUser} | 광명 할당량: ${appData.gmLoadedCount}대 완료`;
               alert("정상적으로 상차 취소(삭제) 되었습니다.");
               showMyList();
           }
        }).catch(err => {
           alert("통신 오류가 발생했습니다. 잠시 후 다시 시도해주세요.");
           showMyList(); 
        });
    }
  </script>
