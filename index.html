<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>테슬라 스캐너</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { -webkit-user-select: none; user-select: none; touch-action: manipulation; }
    #reader video { object-fit: cover; width: 100%; height: 100%; border-radius: 0.5rem; }
  </style>
</head>
<body class="bg-gray-100 text-gray-800 h-screen flex flex-col overflow-hidden">

  <!-- 상단 헤더 (기존 UI 원복) -->
  <header class="bg-blue-700 text-white p-4 text-center font-bold text-xl shadow-md flex justify-between items-center">
    <span>테슬라 스캐너</span>
    <span id="user-info" class="text-sm font-normal hidden"></span>
  </header>

  <!-- 메인 앱 컨테이너 -->
  <div id="app" class="flex-grow flex flex-col relative w-full max-w-md mx-auto bg-white shadow-lg overflow-y-auto">
    
    <!-- 1. 로딩 화면 -->
    <div id="loading-screen" class="flex-grow flex flex-col items-center justify-center p-8">
      <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-700 mb-4"></div>
      <p class="text-blue-700 font-bold">서버 데이터를 불러오는 중...</p>
    </div>

    <!-- 2. 로그인 화면 (이름만 입력하도록 원복) -->
    <div id="login-screen" class="flex-grow flex flex-col items-center justify-center p-8 hidden">
      <h2 class="text-2xl font-bold mb-6 text-gray-700">작업자 로그인</h2>
      <input type="text" id="login-name" placeholder="기사명 입력 (예: 홍길동)" class="w-full p-4 mb-6 border rounded text-lg text-center font-bold">
      <button onclick="handleLogin()" class="w-full bg-blue-700 text-white p-4 rounded font-bold text-lg shadow-md active:bg-blue-800">접속하기</button>
    </div>

    <!-- 3. 메인 메뉴 (모드 선택) -->
    <div id="main-menu" class="flex-grow flex flex-col items-center justify-center p-8 hidden space-y-6">
      <button onclick="startYardMode()" class="w-full bg-emerald-600 text-white p-6 rounded-xl font-bold text-xl shadow-md active:bg-emerald-700">
        야드 위치 등록 모드
      </button>
      <button onclick="showScreen('driver-menu')" class="w-full bg-indigo-600 text-white p-6 rounded-xl font-bold text-xl shadow-md active:bg-indigo-700">
        기사용 스캐너
      </button>
    </div>

    <!-- 4. 기사용 하위 메뉴 -->
    <div id="driver-menu" class="flex-grow flex flex-col items-center justify-center p-8 hidden space-y-6">
      <button onclick="startGwangmyeongMode()" class="w-full bg-sky-600 text-white p-6 rounded-xl font-bold text-xl shadow-md active:bg-sky-700">
        1. 광명딜리버리센터 스캔
      </button>
      <button onclick="showScreen('port-wh-menu')" class="w-full bg-amber-600 text-white p-6 rounded-xl font-bold text-xl shadow-md active:bg-amber-700">
        2. 항/창고 작업 스캔
      </button>
      <button onclick="showScreen('main-menu')" class="w-full bg-gray-300 text-gray-700 p-4 rounded-xl font-bold shadow-md mt-8">뒤로 가기</button>
    </div>

    <!-- 5. 항/창고 작업 설정 화면 -->
    <div id="port-wh-menu" class="flex-grow flex flex-col p-6 hidden">
      <h2 class="text-xl font-bold mb-6 text-center text-amber-700">항 / 창고 작업 설정</h2>
      
      <!-- 작업 선택 라디오 -->
      <div class="flex justify-center space-x-6 mb-8 bg-gray-50 p-4 rounded-lg border">
        <label class="flex items-center space-x-2 text-lg font-bold">
          <input type="radio" name="workType" value="port" onchange="updateDropdowns()" class="w-5 h-5 text-amber-600" checked>
          <span>항작업 스캔</span>
        </label>
        <label class="flex items-center space-x-2 text-lg font-bold">
          <input type="radio" name="workType" value="warehouse" onchange="updateDropdowns()" class="w-5 h-5 text-amber-600">
          <span>창고작업 스캔</span>
        </label>
      </div>

      <!-- 드롭다운 영역 -->
      <div class="space-y-6 flex-grow">
        <div>
          <label class="block text-gray-700 font-bold mb-2">출발지 선택</label>
          <select id="departure" class="w-full border-2 border-gray-300 p-4 rounded-lg text-lg bg-white font-bold"></select>
        </div>
        <div>
          <label class="block text-gray-700 font-bold mb-2">도착지 선택</label>
          <select id="destination" class="w-full border-2 border-gray-300 p-4 rounded-lg text-lg bg-white font-bold"></select>
        </div>
      </div>

      <div class="mt-auto space-y-4 pt-4">
        <button onclick="startPortWhScan()" class="w-full bg-amber-600 text-white p-4 rounded-xl font-bold text-lg shadow-md active:bg-amber-700">카메라 스캔 시작</button>
        <button onclick="showScreen('driver-menu')" class="w-full bg-gray-300 text-gray-700 p-4 rounded-xl font-bold shadow-md">뒤로 가기</button>
      </div>
    </div>

    <!-- 6. 공통 스캐너 화면 -->
    <div id="scanner-screen" class="flex-grow flex flex-col hidden bg-black relative">
      <div id="reader" class="flex-grow w-full"></div>
      <div class="absolute bottom-0 w-full p-6 bg-gradient-to-t from-black to-transparent">
        <p id="scanner-guide" class="text-white text-center font-bold mb-4 bg-black bg-opacity-50 p-2 rounded">차량 바코드/QR을 스캔하세요</p>
        <button onclick="stopScanner()" class="w-full bg-red-600 text-white p-4 rounded-xl font-bold text-lg shadow-md">스캔 취소 (메뉴로 돌아가기)</button>
      </div>
    </div>

  </div>

  <script>
    // 1. 설정 및 변수
    const API_URL = "https://script.google.com/macros/s/AKfycbzP9rkRFf30-UBwDZkYzLrcelBiZdX_x_9G3I0ae1PqgBo3FYxSiE8_yNQSqZPB8pNYgA/exec";
    let appData = {};
    let currentUser = "";
    let html5QrCode = null;
    let currentMode = ""; 

    const LOCATIONS = {
      port: { dep: ["PIRT", "HPIT"], dest: ["PH선광", "배후부지", "AMF(서울우유)", "PCTC(한진)"] },
      warehouse: { dep: ["배후부지", "AMF(서울우유)", "PCTC(한진)"], dest: ["PH선광", "배후부지", "AMF(서울우유)", "PCTC(한진)"] }
    };

    const el = (id) => document.getElementById(id);
    const screens = ['loading-screen', 'login-screen', 'main-menu', 'driver-menu', 'port-wh-menu', 'scanner-screen'];
    
    function showScreen(screenId) {
      screens.forEach(id => el(id).classList.add('hidden'));
      el(screenId).classList.remove('hidden');
    }

    async function initApp() {
      try {
        const response = await fetch(`${API_URL}?action=getData`);
        appData = await response.json();
        showScreen('login-screen');
      } catch (error) {
        alert("데이터를 불러오는데 실패했습니다. 새로고침 해주세요.");
      }
    }

    // 2. 로그인 로직 (이름만 입력하면 통과하도록 원복)
    function handleLogin() {
      const name = el('login-name').value.trim();
      
      if (!name) {
        alert("기사명을 입력해주세요.");
        return;
      }
      
      currentUser = name;
      el('user-info').innerText = `${name} 님`;
      el('user-info').classList.remove('hidden');
      showScreen('main-menu');
    }

    function updateDropdowns() {
      const type = document.querySelector('input[name="workType"]:checked').value;
      const depSelect = el('departure');
      const destSelect = el('destination');
      
      depSelect.innerHTML = LOCATIONS[type].dep.map(v => `<option value="${v}">${v}</option>`).join('');
      destSelect.innerHTML = LOCATIONS[type].dest.map(v => `<option value="${v}">${v}</option>`).join('');
    }

    function startYardMode() { currentMode = 'yard'; el('scanner-guide').innerText = "[야드 위치 등록] 스캔"; openCamera(); }
    function startGwangmyeongMode() { currentMode = 'gwangmyeong'; el('scanner-guide').innerText = "[광명딜리버리] 스캔"; openCamera(); }
    function startPortWhScan() { currentMode = 'port_wh'; el('scanner-guide').innerText = "[항/창고 작업] 스캔"; openCamera(); }

    function openCamera() {
      showScreen('scanner-screen');
      if (html5QrCode) html5QrCode.stop().catch(err => console.log(err));
      
      html5QrCode = new Html5Qrcode("reader");
      const config = { fps: 10, qrbox: { width: 250, height: 250 }, videoConstraints: { facingMode: "environment", zoom: 2.0 } };
      html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess)
        .catch(err => { alert("카메라 권한을 허용해주세요."); showScreen('main-menu'); });
    }

    function stopScanner() {
      if (html5QrCode) {
        html5QrCode.stop().then(() => {
          html5QrCode.clear();
          showScreen(currentMode === 'port_wh' ? 'port-wh-menu' : 'main-menu');
        }).catch(err => console.log(err));
      }
    }

    async function onScanSuccess(decodedText) {
      if (html5QrCode) html5QrCode.pause();

      const parts = decodedText.split('|');
      let vin = parts[parts.length - 1].trim();

      if (vin.length !== 17) {
        alert(`오류: 올바른 차량 QR코드가 아닙니다.\n(인식된 데이터: ${decodedText})`);
        if (html5QrCode) html5QrCode.resume();
        return;
      }

      let action = "";
      let urlParams = `&vin=${vin}`;

      if (currentMode === 'yard') {
        const loc = prompt(`[${vin}]\n현재 위치를 입력하세요 (예: C2, WC 등)`);
        if(!loc) { if (html5QrCode) html5QrCode.resume(); return; }
        action = 'saveYard';
        urlParams += `&loc=${loc}&worker=${currentUser}`;
      
      } else if (currentMode === 'gwangmyeong') {
        action = 'saveGwangmyeong';
        urlParams += `&driver=${currentUser}`;
      
      } else if (currentMode === 'port_wh') {
        const type = document.querySelector('input[name="workType"]:checked').value;
        action = type === 'port' ? 'savePort' : 'saveWarehouse';
        const dep = el('departure').value;
        const dest = el('destination').value;
        urlParams += `&departure=${dep}&destination=${dest}&driver=${currentUser}`;
      }

      try {
        const res = await fetch(`${API_URL}?action=${action}${urlParams}`, { method: 'GET' });
        if (res.ok) {
          alert(`[${vin}] 정상 등록 되었습니다!`);
        }
      } catch (e) {
        alert("전송 실패. 인터넷 연결을 확인해주세요.");
      }

      if (html5QrCode) html5QrCode.resume();
    }

    window.onload = () => {
      updateDropdowns();
      initApp();
    };
  </script>
</body>
</html>
